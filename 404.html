<html lang="en">

    <title>Vite + React + TS</title>

  <body>
    
  <script>
          (function() {
            const { origin, pathname } = window.location;
            const basePath = origin + pathname.split('/').slice(0, 2).join('/') + '/';
            window.location.replace(basePath);
          })();
        </script>
</body>
